services:
  - type: web
    name: konosuba-bot
    env: node
    region: singapore
    plan: free
    buildCommand: >-
      npm install -g pnpm@9 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-spec run codegen &&
      pnpm --filter @workspace/konosuba-bot exec vite build --config vite.config.prod.ts &&
      pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOT_API_URL
        value: ""
