<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Konosuba Bot</title>
    <meta name="description" content="Konosuba Bot — the ultimate WhatsApp RPG. Catch Pokémon, collect cards, battle players and conquer the Konosuba world." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — square image for WhatsApp small-thumbnail preview (small square on left, text on right) -->
    <meta property="og:title" content="Konosuba Bot" />
    <meta property="og:description" content="The ultimate WhatsApp RPG bot — Pokémon, cards, battles &amp; economy." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://konosubacommunity.onrender.com/" />
    <meta property="og:image" content="https://konosubacommunity.onrender.com/og-image.jpg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- twitter:card = summary → gives small square left-thumbnail in WhatsApp -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Konosuba Bot" />
    <meta name="twitter:description" content="The ultimate WhatsApp RPG bot — Pokémon, cards, battles &amp; economy." />
    <meta name="twitter:image" content="https://konosubacommunity.onrender.com/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
