<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Shadow Garden Bot</title>
    <meta name="description" content="Shadow Garden — the ultimate WhatsApp RPG bot. Catch Pokémon, collect cards, battle players, and conquer the Konosuba world." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — square image for WhatsApp small-thumbnail preview -->
    <meta property="og:title" content="Shadow Garden Bot" />
    <meta property="og:description" content="The ultimate WhatsApp RPG bot — Pokémon, cards, battles & economy." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/jpeg" />

    <!-- Twitter / WhatsApp fallback — "summary" gives the small square left-thumbnail layout -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shadow Garden Bot" />
    <meta name="twitter:description" content="The ultimate WhatsApp RPG bot — Pokémon, cards, battles & economy." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
